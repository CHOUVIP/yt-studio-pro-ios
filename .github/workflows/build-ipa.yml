name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config || true
          python -m pip install --upgrade pip
          pip install kivy-ios pillow
      - name: Build Python + Kivy for iOS (toolchain)
        run: |
          toolchain build python3 kivy openssl sqlite3 requests
      - name: Create Xcode project from app sources
        run: |
          toolchain create YTStudioPro com.chouvip.ytstudiopro
      - name: Set app icon (CHOUVIP)
        run: |
          python3 set_icon.py . icon.png
      - name: Build unsigned .app with Xcode
        run: |
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 3 | head -1)
          echo "Project: $PROJ"
          SCHEME=$(xcodebuild -project "$PROJ" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release -destination "generic/platform=iOS" -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" build
      - name: Package .ipa (unsigned — sign later with ESign)
        run: |
          APP=$(find build -name "*.app" -type d | head -1)
          echo "App: $APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry YT_Studio_Pro_iOS_unsigned.ipa Payload
          ls -lh YT_Studio_Pro_iOS_unsigned.ipa
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Studio-Pro-iOS-ipa
          path: YT_Studio_Pro_iOS_unsigned.ipa
          if-no-files-found: error
