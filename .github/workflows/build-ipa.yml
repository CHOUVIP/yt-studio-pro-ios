name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: |
          brew install autoconf automake libtool pkg-config
          python -m pip install --upgrade pip
          python -m pip install cython kivy-ios pillow
          which cython pkg-config autoconf automake libtool
          cython --version
      - name: Build Python + Kivy for iOS (toolchain)
        run: |
          toolchain build python3 kivy pyobjus openssl

      - name: Create Xcode project from app sources
        run: |
          mkdir -p app_src
          cp main.py ytb_core.py studio_core.py app_src/
          toolchain create YTStudioPro app_src
          grep -rl "org.kivy.ytstudiopro" ytstudiopro-ios | while read f; do sed -i '' 's/org.kivy.ytstudiopro/com.chouvip.ytstudiopro/g' "$f"; done
          grep -rh -A1 CFBundleIdentifier ytstudiopro-ios --include="*-Info.plist" | head -4

      - name: Install pure-Python packages into the app
        run: |
          toolchain pip install requests deep-translator

      - name: Set app icon (CHOUVIP)
        run: |
          python3 set_icon.py . icon.png

      - name: Build unsigned .app with Xcode
        run: |
          PROJ=$(find . -name "*.xcodeproj" -maxdepth 3 | head -1)
          echo "Project: $PROJ"
          SCHEME=$(xcodebuild -project "$PROJ" -list -json | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['project']['schemes'][0])")
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJ" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -derivedDataPath xcodebuild_out \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGNING_IDENTITY="" \
            build

      - name: Package .ipa (unsigned — sign later with ESign)
        run: |
          APP=$(find xcodebuild_out/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -type d | head -1)
          echo "App: $APP"
          du -sh "$APP"
          ls "$APP"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry YT_Studio_Pro_iOS_unsigned.ipa Payload
          ls -lh YT_Studio_Pro_iOS_unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: YT-Studio-Pro-iOS-ipa
          path: YT_Studio_Pro_iOS_unsigned.ipa
          if-no-files-found: error
